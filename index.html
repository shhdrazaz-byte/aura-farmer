!DOCTYPE html><html lang="en">
<head>
  <link rel="manifest" href="manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aura Farmer</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#101827;color:white;padding:20px}
header{display:flex;justify-content:space-between;align-items:center}
h1{color:#a7f3b5;font-size:27px}
.card{background:#1e293b;padding:20px;border-radius:18px;margin:18px 0}
.aura{text-align:center}
.orb{width:110px;height:110px;border-radius:50%;margin:20px auto;background:radial-gradient(circle,#d9ffe1,#41c879,#146c43);box-shadow:0 0 35px #41c879}
.points{font-size:32px;font-weight:bold;color:#a7f3b5}
.progress{height:10px;background:#334155;border-radius:10px;overflow:hidden}
.bar{height:100%;width:0;background:#4ade80;transition:.3s}
button{border:0;border-radius:10px;padding:12px;background:#4ade80;color:#102016;font-weight:bold;cursor:pointer}
.habit{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px 0;border-bottom:1px solid #334155}
.habit button{min-width:75px}
small{color:#b8c5d6}
</style>
</head>
<body>
<header>
<div><h1>🌱 Aura Farmer</h1><small>Grow yourself every day.</small></div>
<div>⚡ LEVEL <span id="level">1</span></div>
</header><div class="card aura">
<div class="orb"></div>
<h2>Your Aura</h2>
<div class="points"><span id="points">0</span> XP</div>
<p id="message">Your journey starts today!</p>
<div class="progress"><div class="bar" id="bar"></div></div>
<p><small id="progressText">0 / 100 XP to next level</small></p>
</div><div class="card">
<h2>🎯 Daily Habits</h2>
<p><small>Complete habits to earn 10 XP each.</small></p>
<div id="habits"></div>
</div><div class="card">
<h2>🔥 Daily Streak</h2>
<div style="font-size:25px">🔥 <span id="streak">0</span> days</div>
<p><small>Keep completing your habits!</small></p>
<button onclick="resetDay()">New Day ↻</button>
</div><script>
const defaultHabits=[
"💧 Drink water",
"📚 Study for 20 minutes",
"🏃 Move your body",
"🧘 Take a mindful break",
"📵 Spend time offline"
];
let data;
try{data=JSON.parse(localStorage.getItem("auraFarmer"))}catch(e){}
if(!data)data={points:0,done:[],date:new Date().toDateString(),streak:0};

function save(){
localStorage.setItem("auraFarmer",JSON.stringify(data));
render();
}
function render(){
document.getElementById("points").textContent=data.points;
let level=Math.floor(data.points/100)+1;
document.getElementById("level").textContent=level;
let xp=data.points%100;
document.getElementById("bar").style.width=xp+"%";
document.getElementById("progressText").textContent=xp+" / 100 XP to next level";
document.getElementById("streak").textContent=data.streak;
document.getElementById("message").textContent=
data.points>=100?"Amazing! Your aura is growing!":"Every small habit makes you stronger.";
document.getElementById("habits").innerHTML=defaultHabits.map((h,i)=>`
<div class="habit">
<span>${h}</span>
<button onclick="toggleHabit(${i})">${data.done.includes(i)?"✓ Done":"+ 10 XP"}</button>
</div>`).join("");
}
function toggleHabit(i){
if(data.done.includes(i))return;
data.done.push(i);
data.points+=10;
save();
}
function resetDay(){
let today=new Date().toDateString();
if(data.date===today){
alert("Aaj ka day already active hai! Kal phir aana.");
return;
}
let yesterday=new Date();
yesterday.setDate(yesterday.getDate()-1);
data.streak=data.date===yesterday.toDateString()?data.streak+1:1;
data.date=today;
data.done=[];
save();
}
render();
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js");
  });
}
</script>

</body>
</html>
